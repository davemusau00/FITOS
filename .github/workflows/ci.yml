name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: fitos_test
          POSTGRES_USER: fitos
          POSTGRES_PASSWORD: fitos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fitos -d fitos_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://fitos:fitos@localhost:5432/fitos_test
      TEST_DATABASE_URL: postgresql://fitos:fitos@localhost:5432/fitos_test
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-session-secret-must-be-long-enough
      CSRF_SECRET: ci-csrf-secret-must-be-long-enough
      FITOS_REPOSITORY: drizzle
      WEB_PUBLIC_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm test
      - run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
