name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: fitos_test
          POSTGRES_USER: fitos
          POSTGRES_PASSWORD: fitos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fitos -d fitos_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://fitos:fitos@localhost:5432/fitos_test
      TEST_DATABASE_URL: postgresql://fitos:fitos@localhost:5432/fitos_test
      E2E_DATABASE_URL: postgresql://fitos:fitos@localhost:5432/fitos_test
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-session-secret-must-be-long-enough
      CSRF_SECRET: ci-csrf-secret-must-be-long-enough
      FITOS_REPOSITORY: drizzle
      RUN_DATABASE_TESTS: true
      WEB_PUBLIC_URL: http://localhost:5173
      FITOS_ENV_FILE: .env.example
      FITOS_RELEASE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm run db:seed
      - name: Unit, integration, tenancy, and HTTP security tests
        run: npm test
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - name: Validate production Compose configuration
        run: FITOS_ENV_FILE=.env.example docker compose -f compose.yaml -f compose.production.yaml config --quiet
      - name: Build production images
        run: docker compose -f compose.yaml -f compose.production.yaml build api worker nginx backup
      - name: Validate backup and restore scripts
        run: >-
          docker run --rm --entrypoint sh fitos-backup:${FITOS_RELEASE_TAG}
          -n /usr/local/bin/fitos-backup /usr/local/bin/fitos-restore /usr/local/bin/fitos-verify-restore
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
