services:
  nginx:
    image: fitos-nginx:${FITOS_RELEASE_TAG:-local}
    build:
      context: .
      dockerfile: infra/docker/nginx.Dockerfile
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
    networks: [edge, app]
    restart: unless-stopped

  api:
    image: fitos-api:${FITOS_RELEASE_TAG:-local}
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file: ${FITOS_ENV_FILE:-.env.production}
    environment:
      FITOS_REPOSITORY: drizzle
      FITOS_RELEASE_TAG: ${FITOS_RELEASE_TAG:-local}
    expose: ["3000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [app, data]
    restart: unless-stopped

  worker:
    image: fitos-worker:${FITOS_RELEASE_TAG:-local}
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    env_file: ${FITOS_ENV_FILE:-.env.production}
    environment:
      FITOS_RELEASE_TAG: ${FITOS_RELEASE_TAG:-local}
      WORKER_METRICS_PORT: 9464
    expose: ["9464"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [data]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:9464/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backup:
    image: fitos-backup:${FITOS_RELEASE_TAG:-local}
    build:
      context: .
      dockerfile: infra/docker/backup.Dockerfile
    profiles: ["operations"]
    env_file: ${FITOS_ENV_FILE:-.env.production}
    environment:
      BACKUP_DIRECTORY: /backups
      BACKUP_OFFSITE_DIRECTORY: /offsite
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${BACKUP_HOST_DIRECTORY:-./.data/backups}:/backups
      - ${BACKUP_OFFSITE_HOST_DIRECTORY:-./.data/offsite-backups}:/offsite
      - ${BACKUP_IDENTITY_HOST_DIRECTORY:-./.data/backup-identity}:/identity:ro
    networks: [data]
    restart: "no"

  postgres:
    ports: !reset []
    env_file: ${FITOS_ENV_FILE:-.env.production}
    networks: [data]

  redis:
    ports: !reset []
    networks: [data]

networks:
  edge:
  app:
  data:
