global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: fitos-api
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["api:3000"]

  - job_name: fitos-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9464"]

  - job_name: fitos-postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: fitos-redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: fitos-host
    static_configs:
      - targets: ["node-exporter:9100"]
